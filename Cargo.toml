[workspace]
members = [
  "apps/home-host/src-tauri",
  "crates/bridge-fake",
  "crates/bridge-sdk",
  "crates/contracts",
  "crates/domain",
  "crates/session",
  "crates/transport",
  "services/core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/dkaerit/LIMEN"

[workspace.dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
interprocess = { version = "2.4.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
